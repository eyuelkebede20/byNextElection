name: Deploy to cPanel

on:
  push:
    branches:
      - main

# This app (client/) is a SINGLE SvelteKit SSR app — the UI and its /api routes
# are the same Node server. We build it with @sveltejs/adapter-node to a
# standalone `build/index.js` and run it as one cPanel Passenger Node app on
# bynextelection.senaycreatives.com. There is no separate backend.
jobs:
  deploy:
    runs-on: ubuntu-latest
    # FTP_SERVER / FTP_USERNAME / FTP_PASSWORD live in this GitHub Environment,
    # so the job must declare it to read them (otherwise secrets.* are empty).
    environment: ByNextElection
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No build-time env needed: every config value is read at RUNTIME via
      # $env/dynamic/* from the Passenger app's environment, not baked in here.
      - name: Build SvelteKit (adapter-node)
        working-directory: ./client
        run: |
          npm install
          npm run build

      # Stage a SMALL payload. Runtime deps (mongoose, …) are bundled INTO
      # build/ via `ssr.noExternal` in vite.config.ts, so the app runs from
      # build/ alone — no node_modules to ship (uploading it over FTP is far
      # too slow) and no server-side `npm install` required. package.json +
      # package-lock.json are included only as a fallback so you *can* run
      # `npm i` on the server if you ever need to.
      - name: Stage deploy payload
        run: |
          mkdir -p deploy/tmp
          cp -r client/build deploy/build
          cp client/package.json deploy/package.json
          cp client/package-lock.json deploy/package-lock.json
          # Write CHANGING content so the FTP delta-sync re-uploads this file
          # (an unchanged file is skipped), refreshing its mtime so Passenger
          # restarts the app and picks up the new build.
          echo "restart ${GITHUB_SHA} $(date +%s)" > deploy/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          # MUST be the cPanel Node app's "Application Root" so build/index.js
          # lands where Passenger runs the app. Defaults to the FTP account's
          # home (./); set the FTP_SERVER_DIR secret to the app root if the
          # account lands somewhere else.
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Never upload node_modules over FTP — far too slow, and not needed
          # (deps are bundled into build/).
          exclude: |
            **/node_modules/**
            **/.env
            **/.git/**
