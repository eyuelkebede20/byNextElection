name: Deploy bynextelection.senaycreatives.com

# Till Next Election is ONE SvelteKit app — UI + /api routes are the same Node
# server. On every push to main we build it with @sveltejs/adapter-node into a
# standalone build/index.js, then FTP it to the single cPanel Passenger Node app
# at bynextelection.senaycreatives.com. No frontend/backend split, no node_modules
# upload (deps are bundled into build/ via ssr.noExternal), no server npm install.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # allow manual re-deploys from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FTP_SERVER / FTP_USERNAME / FTP_PASSWORD (+ optional FTP_SERVER_DIR) live in
    # this GitHub Environment; the job must declare it or secrets.* read empty.
    environment: ByNextElection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No build-time secrets: all config is read at RUNTIME via $env/dynamic/*
      # from the Passenger app's environment.
      - name: Build
        working-directory: ./client
        run: |
          npm install
          npm run build

      # Assemble the (small) thing we ship: the self-contained build/, plus the
      # manifests purely as an npm-install fallback, plus a restart trigger.
      - name: Stage payload
        run: |
          mkdir -p deploy/tmp
          cp -r client/build           deploy/build
          cp client/package.json       deploy/package.json
          cp client/package-lock.json  deploy/package-lock.json
          # Changing content forces the FTP delta-sync to re-upload this file,
          # refreshing its mtime so Passenger restarts and serves the new build.
          echo "restart ${GITHUB_SHA} $(date +%s)" > deploy/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          # Plain FTP unless an FTP_PROTOCOL secret says otherwise (e.g. "ftps"
          # if the host enforces TLS). Default matches the earlier working runs.
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          # Be patient with a busy/throttling cPanel control socket (default 30s).
          timeout: 120000
          local-dir: ./deploy/
          # Land exactly in the cPanel Node app's "Application Root" (where
          # Passenger runs build/index.js). Set FTP_SERVER_DIR to that path;
          # falls back to the FTP account's home if unset.
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          # Don't touch node_modules: never upload one (too slow), and protect
          # the symlink CloudLinux Node.js Selector keeps in the app root.
          exclude: |
            **/node_modules/**
            **/.env
            **/.git/**
